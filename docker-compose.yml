  connector-virustotal:
    image: opencti/connector-virustotal:6.7.5
    platform: linux/amd64
    environment:
      # --- OpenCTI Connection ---
      - OPENCTI_URL=http://opencti:8080                # ✅ Use OpenCTI service name from docker-compose
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}           # ✅ Use your real admin or connector token
      - CONNECTOR_ID=5d2c6ae0-cc4a-4a71-8b2c-25f61e94d903 # Generate UUID using: uuidgen
      - CONNECTOR_NAME=VirusTotal
      - CONNECTOR_SCOPE=StixFile,Artifact,IPv4-Addr,Domain-Name,Url,Hostname
      - CONNECTOR_AUTO=true                            # ✅ Enable auto-enrichment for observables
      - CONNECTOR_LOG_LEVEL=info
      - CONNECTOR_EXPOSE_METRICS=false

      # --- VirusTotal API Config ---
      - VIRUSTOTAL_TOKEN=18aa9ef8ad8ab0849bb3841ce369772cc645b779f9fccce875ea5685c030ce2d       # ✅ Required (Public/Enterprise key)
      - VIRUSTOTAL_MAX_TLP=TLP:AMBER                   # Optional: only enrich observables <= this TLP
      - VIRUSTOTAL_REPLACE_WITH_LOWER_SCORE=true       # Optional: allow lower VT score to overwrite

      # --- File / Artifact Enrichment ---
      - VIRUSTOTAL_FILE_CREATE_NOTE_FULL_REPORT=true   # ✅ Attach full VT report as note
      - VIRUSTOTAL_FILE_UPLOAD_UNSEEN_ARTIFACTS=true   # Optional: upload new samples (<32 MB)
      - VIRUSTOTAL_FILE_INDICATOR_CREATE_POSITIVES=10  # ✅ Create indicator if >=10 engines detect
      - VIRUSTOTAL_FILE_INDICATOR_VALID_MINUTES=2880   # Indicator valid for 2 days
      - VIRUSTOTAL_FILE_INDICATOR_DETECT=true
      - VIRUSTOTAL_FILE_IMPORT_YARA=true               # Optional: import crowdsourced YARA rules

      # --- IP / Domain Enrichment ---
      - VIRUSTOTAL_IP_INDICATOR_CREATE_POSITIVES=10
      - VIRUSTOTAL_IP_ADD_RELATIONSHIPS=true           # ✅ Add ASN, location relationships
      - VIRUSTOTAL_DOMAIN_INDICATOR_CREATE_POSITIVES=10
      - VIRUSTOTAL_DOMAIN_ADD_RELATIONSHIPS=true       # ✅ Add resolved IP relationships

      # --- URL Enrichment ---
      - VIRUSTOTAL_URL_UPLOAD_UNSEEN=true
      - VIRUSTOTAL_URL_INDICATOR_CREATE_POSITIVES=10
      - VIRUSTOTAL_URL_INDICATOR_VALID_MINUTES=2880
      - VIRUSTOTAL_URL_INDICATOR_DETECT=true

      # --- Notes & Attributes ---
